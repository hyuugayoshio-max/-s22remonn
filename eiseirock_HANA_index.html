<!DOCTYPE html>
<!--
【焼肉の女】劇用スマホ（赤奈）ロック解除〜HANAトーク画面
撮影用・単一HTMLファイル（外部読み込みなし）
書き換えはCONFIGだけ
スタッフ用キー一覧（PC・Bluetoothキーボード）
  A        … 自動再生（ロック画面→パスコード自動入力→ホーム／ホーム画面ではトークを開く）
  R        … 最初（ロック画面）に戻す
  0〜9     … パスコード入力（全角数字・テンキー可）
  Backspace… 1文字削除
  M        … どの状態からでも、すぐトーク画面を開く
  B・Esc   … トーク画面を閉じる（パスコード画面ではロック画面へ戻る）
-->

<script>
(() => {
'use strict';
const C = CONFIG, SH = C.show || {};
const $ = id => document.getElementById(id);
const phone = $('phone'), lock = $('lock'), pass = $('pass'), home = $('home'), chat = $('chat'), list = $('list');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const touch = matchMedia('(hover: none) and (pointer: coarse)').matches;
if (touch) document.body.classList.add('touch');
let W = 390, H = 844, U = 1, state = 'lock', busy = false;
const timers = new Set();
const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
const clearAll = () => { timers.forEach(clearTimeout); timers.clear(); };

/* ---- 画像（ファイル名があれば読み込みを試し、読めたときだけ差し替え） ---- */
const url = s => "url('" + s + "')";
function tryImg(file, emb, cb){
  if (emb) cb(emb);
  if (!file) return;
  const im = new Image();
  im.onload = () => cb(file);
  im.src = file;
}
let lockSrc = EMBED_LOCK, wallLoaded = false;
tryImg(C.lockImage, EMBED_LOCK, s => {
  lockSrc = s;
  $('lockimg').style.backgroundImage = url(s);
  $('pbg').style.backgroundImage = url(s);
  if (!wallLoaded) $('hbg').style.backgroundImage = url(s);
  avgBottom(s, 0.035, c => { gapColor.lock = toCss(c); paintGap(); });
  avgBottom(s, 0.18, c => { gapColor.blur = toCss(blurMix(c)); paintGap(); });
});
tryImg(C.wallpaper, '', s => { wallLoaded = true; $('hbg').style.backgroundImage = url(s); avgBottom(s, 0.18, c => { gapColor.wall = toCss(blurMix(c)); paintGap(); }); });
let avatarSrc = EMBED_AVATAR, thumbSrc = EMBED_THUMB;
tryImg(C.avatarImage, '', s => { avatarSrc = s; document.querySelectorAll('.av').forEach(a => a.style.backgroundImage = url(s)); });
tryImg(C.linkThumbImage, '', s => { thumbSrc = s; document.querySelectorAll('.card .th').forEach(a => a.style.backgroundImage = url(s)); });

/* ---- fix:true の自動縮小 ---- */
function fitFix(){
  const cs = getComputedStyle(list);
  const rw = list.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  list.style.setProperty('--rw', rw + 'px');
  list.querySelectorAll('.bub.fix').forEach(b => {
    b.style.fontSize = '';
    const o = b.closest('.row').classList.contains('o');
    const maxW = rw - (o ? 49 : 40) * U - 46 * U - 28 * U;
    let need = 0;
    b.querySelectorAll('.l').forEach(l => need = Math.max(need, l.offsetWidth));
    if (need > maxW) b.style.fontSize = (15.5 * U * maxW / need * 0.985) + 'px';
  });
}

/* ---- サイズ（--u ＝ 画面幅/390 px） ---- */
function layout(){
  const iw = window.innerWidth, ih = window.innerHeight;
  let g = 0;
  if (touch) {
    W = iw; H = ih;
    phone.style.width = ''; phone.style.height = '';
    // iOS 26の「ホーム画面に追加」全画面表示では、画面下の帯（ステータスバーと同じ高さ）にページを描けない不具合がある。
    // その高さを測って --g に入れ、下に付く部品の位置を本来の画面下からの位置に近づける
    const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
    if (standalone && ih >= iw) {
      const d = screen.height - ih;
      if (d > 8 && d < 120) g = d;
    }
  } else {
    W = Math.min(iw, ih * 390 / 844); H = W * 844 / 390;
    phone.style.width = W + 'px'; phone.style.height = H + 'px';
    phone.style.left = ((iw - W) / 2) + 'px'; phone.style.top = ((ih - H) / 2) + 'px';
  }
  GAP = g;
  U = W / 390;
  phone.style.setProperty('--u', U + 'px');
  phone.style.setProperty('--g', g + 'px');
  fitFix();
  paintGap();
}

/* ---- 画面下の帯の色を、表示中の画面の一番下の色に合わせる（帯には背景色しか出せないため） ---- */
let GAP = 0;
const gapColor = { lock: '#3a3530', blur: '#2b2e3a', wall: '' , chat: '#ffffff' };
function avgBottom(src, frac, cb){
  const im = new Image();
  im.onload = () => {
    try {
      const cw = 40, chh = Math.max(4, Math.round(40 * im.height / im.width));
      const c = document.createElement('canvas'); c.width = cw; c.height = chh;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, cw, chh);
      const rows = Math.max(1, Math.round(chh * frac));
      const d = x.getImageData(0, chh - rows, cw, rows).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
      cb([r / n, g / n, b / n]);
    } catch (_) {}
  };
  im.src = src;
}
const toCss = c => `rgb(${c.map(v => Math.round(Math.max(0, Math.min(255, v)))).join(',')})`;
// ぼかし背景の色：明るさ .82 → 暗幕 rgba(0,12,34,.26) を重ねた色

    else if (state === 'chat') col = gapColor.chat;
    else if (state === 'home') col = gapColor.wall || gapColor.blur;
    else col = gapColor.blur;
  }
  document.documentElement.style.backgroundColor = col;
  document.body.style.backgroundColor = col;
}

let drag = null;
lock.addEventListener('pointerdown', e => {
  if (state !== 'lock' || e.target.closest('.lbtn')) return;
  const t = performance.now();
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dy: 0, moved: false, ly: e.clientY, lt: t, v: 0 };
  try { lock.setPointerCapture(e.pointerId); } catch (_) {}
  lock.style.transition = 'none';
});
lock.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const t = performance.now(), dy = Math.min(0, e.clientY - drag.y0);
  if (Math.abs(e.clientY - drag.y0) > 6 || Math.abs(e.clientX - drag.x0) > 6) drag.moved = true;
  drag.v = (e.clientY - drag.ly) / Math.max(1, t - drag.lt); drag.ly = e.clientY; drag.lt = t; drag.dy = dy;
  lock.style.transform = `translateY(${dy}px)`;
});
function endDrag(e, cancel){
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  const v = performance.now() - d.lt < 100 ? d.v : 0;
  if (!cancel && (!d.moved || -d.dy >= H * 0.25 || (v < -0.45 && -d.dy >= 10))) openPass();
  else { lock.style.transition = 'transform .3s cubic-bezier(.3,.8,.3,1)'; lock.style.transform = 'translateY(0)'; }
}

/* ---- ② パスコード画面 ---- */
let code = [];
function renderCode(){
  document.querySelectorAll('#dots .dot').forEach((d, i) => d.classList.toggle('f', i < code.length));
  $('pCancel').textContent = code.length ? C.text.del : C.text.cancel;

function lightKey(k){
  const n = document.querySelector(`.key[data-k="${k}"]`);

  n.classList.add('lit'); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('lit'), 120);

function inputDigit(d){
  if (state !== 'pass' || busy || code.length >= CODE.length) return;
  code.push(C.anyKeyCorrect ? CODE[code.length] : d);
  renderCode();
  if (code.length < CODE.length) return;
  busy = true;
  if (C.anyKeyCorrect || code.join('') === CODE) later(unlock, 160);
  else {
    const dots = $('dots'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
    later(() => { dots.classList.remove('shake'); resetCode(); }, 500);
  }
}
function deleteDigit(){
  if (state !== 'pass' || busy) return;
  if (code.length) { code.pop(); renderCode(); } else backToLock();
}
document.querySelectorAll('.key').forEach(k => {

});

/* ---- ③ ホーム画面 ---- */
function homeIntro(){
  const pr = phone.getBoundingClientRect(), cx = pr.left + pr.width / 2, cy = pr.top + pr.height / 2;
  const pops = [...home.querySelectorAll('.pop')].filter(n => n.offsetParent !== null);
  const info = pops.map(n => { const r = n.getBoundingClientRect(); return [n, Math.hypot(r.left + r.width / 2 - cx, r.top + r.height / 2 - cy)]; });
  const max = Math.max(1, ...info.map(i => i[1]));
  info.forEach(([n, d]) => {
    n.style.animationDelay = (0.04 + d / max * 0.26).toFixed(3) + 's';
    n.classList.add('go');
    n.addEventListener('animationend', function f(){ n.classList.remove('go'); n.style.animationDelay = ''; n.removeEventListener('animationend', f); });
  });
  const band = home.querySelector('.dockband');
  band.classList.add('go');
  band.addEventListener('animationend', function f(){ band.classList.remove('go'); band.removeEventListener('animationend', f); });
  home.classList.remove('intro'); void home.offsetWidth;
  home.classList.add('intro');
  home.classList.remove('hidden');
}

/* ---- リセット・即トーク・自動再生 ---- */
function reset(){
  clearAll(); drag = null; hp = null;
  chat.classList.add('notrans'); chat.classList.remove('open', 'closing'); void chat.offsetWidth; chat.classList.remove('notrans');
  noAnim(pass, () => pass.classList.remove('out', 'gone'));
  home.querySelectorAll('.go').forEach(n => { n.classList.remove('go'); n.style.animationDelay = ''; });
  home.classList.remove('intro'); home.classList.add('hidden');
  noAnim(lock, () => { lock.style.transform = 'translateY(0)'; });
  $('bLight').classList.remove('on'); cam.classList.remove('down');

  if (state === 'chat') return;

function autoFill(startDelay){
  let t = startDelay;
  for (let i = code.length; i < CODE.length; i++) {
    later(() => { lightKey(CODE[code.length] ?? CODE[i]); inputDigit(CODE[code.length] ?? CODE[i]); }, t);
    t += 360;
  }
}
function autoPlay(){
  if (state === 'lock') { openPass(); autoFill(650); }
  else if (state === 'pass') { if (!busy) autoFill(150); }
  else if (state === 'home') openChat();

/* ---- スタッフ用キーボード操作 ---- */
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  let k = e.key || '';
  if (/^[０-９]$/.test(k)) k = String.fromCharCode(k.charCodeAt(0) - 0xFEE0);
  const cd = e.code || '';
  let dg = /^[0-9]$/.test(k) ? k : (/^(Digit|Numpad)[0-9]$/.test(cd) ? cd.slice(-1) : null);
  if (dg !== null) { e.preventDefault(); if (state === 'pass') { lightKey(dg); inputDigit(dg); } return; }
  const lk = k.toLowerCase();
  const is = c => lk === c || lk === String.fromCharCode(c.charCodeAt(0) + 0xFEE0) || cd === 'Key' + c.toUpperCase();
  if (k === 'Backspace') { e.preventDefault(); deleteDigit(); }
  else if (k === 'Escape' || is('b')) { e.preventDefault(); if (state === 'chat') closeChat(); else if (state === 'pass') { clearAll(); backToLock(); } }
  else if (is('a')) { e.preventDefault(); autoPlay(); }
  else if (is('r')) { e.preventDefault(); reset(); }
  else if (is('m')) { e.preventDefault(); goChatNow(); }
});
